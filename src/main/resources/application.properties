spring.application.name=smaact3

# ===== Base de datos (MySQL) =====
# La URL apunta a la base local. El usuario y la contrasena NO se escriben aqui:
# se leen del archivo db.properties (que NO se sube a GitHub) o de variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smaact3_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Importa credenciales desde ./db.properties si existe (en la carpeta desde donde se ejecuta la app)
spring.config.import=optional:file:./db.properties

# ===== JPA / Hibernate =====
# update: crea o actualiza las tablas segun las clases @Entity
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que genera Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Thymeleaf =====
# Sin cache para ver los cambios del HTML sin reiniciar
spring.thymeleaf.cache=false
