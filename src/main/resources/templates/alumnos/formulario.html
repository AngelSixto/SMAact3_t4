<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">SMAact3_t4</span>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/alumnos}">Alumnos</a>
            <a class="nav-link" th:href="@{/carreras}">Carreras</a>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 640px;">
    <h1 class="h3 mb-3" th:text="${titulo}"></h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-warning" th:if="${#lists.isEmpty(carreras)}">
        Primero registra al menos una carrera en <a th:href="@{/carreras/nuevo}">Carreras</a>.
    </div>

    <!-- Si el alumno no tiene id es CREAR (POST /alumnos); si tiene id es ACTUALIZAR -->
    <form class="card card-body"
          th:action="${alumno.id == null} ? @{/alumnos} : @{/alumnos/editar/{id}(id=${alumno.id})}"
          th:object="${alumno}" method="post">

        <div class="mb-3">
            <label class="form-label">Numero de control</label>
            <input class="form-control" type="text" th:field="*{numeroControl}" maxlength="20" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Nombre</label>
                <input class="form-control" type="text" th:field="*{nombre}" maxlength="60" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Apellidos</label>
                <input class="form-control" type="text" th:field="*{apellidos}" maxlength="80" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-8 mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" th:field="*{email}" maxlength="100">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Semestre</label>
                <input class="form-control" type="number" th:field="*{semestre}" min="1" max="14" required>
            </div>
        </div>

        <!-- Relacion: se elige la carrera; se envia su id como carrera.id -->
        <div class="mb-3">
            <label class="form-label">Carrera</label>
            <select class="form-select" th:field="*{carrera.id}" required>
                <option value="">-- Selecciona una carrera --</option>
                <option th:each="c : ${carreras}" th:value="${c.id}"
                        th:text="${c.clave + ' - ' + c.nombre}"></option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-success" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/alumnos}">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
