<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alumnos - SMAact3_t4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">SMAact3_t4</span>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/alumnos}">Alumnos</a>
            <a class="nav-link" th:href="@{/carreras}">Carreras</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Alumnos</h1>
        <a class="btn btn-success" th:href="@{/alumnos/nuevo}">+ Nuevo alumno</a>
    </div>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <!-- Filtro por carrera (@RequestParam carreraId) -->
    <form class="row g-2 mb-3" th:action="@{/alumnos}" method="get">
        <div class="col-auto">
            <select class="form-select" name="carreraId">
                <option value="">Todas las carreras</option>
                <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.nombre}"
                        th:selected="${c.id == carreraId}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-primary" type="submit">Filtrar</button>
        </div>
    </form>

    <table class="table table-striped table-hover bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>No. control</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Semestre</th>
            <th>Carrera</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${alumnos}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.numeroControl}"></td>
            <td th:text="${a.nombre + ' ' + a.apellidos}"></td>
            <td th:text="${a.email}"></td>
            <td th:text="${a.semestre}"></td>
            <!-- La relacion: se muestra el NOMBRE de la carrera, no solo su id -->
            <td>
                <span class="badge text-bg-info" th:text="${a.carrera.clave}"></span>
                <span th:text="${a.carrera.nombre}"></span>
            </td>
            <td class="text-end">
                <a class="btn btn-sm btn-primary" th:href="@{/alumnos/editar/{id}(id=${a.id})}">Editar</a>
                <form class="d-inline" th:action="@{/alumnos/eliminar/{id}(id=${a.id})}" method="post"
                      onsubmit="return confirm('¿Seguro que deseas eliminar este alumno?');">
                    <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(alumnos)}">
            <td colspan="7" class="text-center text-muted">No hay alumnos registrados.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
