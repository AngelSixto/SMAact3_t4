<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carreras - SMAact3_t4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">SMAact3_t4</span>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/alumnos}">Alumnos</a>
            <a class="nav-link active" th:href="@{/carreras}">Carreras</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Carreras</h1>
        <a class="btn btn-success" th:href="@{/carreras/nuevo}">+ Nueva carrera</a>
    </div>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <table class="table table-striped table-hover bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Clave</th>
            <th>Nombre</th>
            <th>Alumnos inscritos</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${carreras}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.clave}"></td>
            <td th:text="${c.nombre}"></td>
            <!-- Lado @OneToMany de la relacion: cuantos alumnos tiene la carrera -->
            <td>
                <a th:href="@{/alumnos(carreraId=${c.id})}" th:text="${#lists.size(c.alumnos)} + ' alumno(s)'"></a>
            </td>
            <td class="text-end">
                <a class="btn btn-sm btn-primary" th:href="@{/carreras/editar/{id}(id=${c.id})}">Editar</a>
                <form class="d-inline" th:action="@{/carreras/eliminar/{id}(id=${c.id})}" method="post"
                      onsubmit="return confirm('¿Seguro que deseas eliminar esta carrera?');">
                    <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(carreras)}">
            <td colspan="5" class="text-center text-muted">No hay carreras registradas.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
