<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Carrera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">SMAact3_t4</span>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/alumnos}">Alumnos</a>
            <a class="nav-link active" th:href="@{/carreras}">Carreras</a>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 560px;">
    <h1 class="h3 mb-3" th:text="${titulo}"></h1>

    <form class="card card-body"
          th:action="${carrera.id == null} ? @{/carreras} : @{/carreras/editar/{id}(id=${carrera.id})}"
          th:object="${carrera}" method="post">
        <div class="mb-3">
            <label class="form-label">Clave</label>
            <input class="form-control" type="text" th:field="*{clave}" maxlength="10" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input class="form-control" type="text" th:field="*{nombre}" maxlength="100" required>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-success" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/carreras}">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
